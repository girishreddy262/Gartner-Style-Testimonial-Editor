<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Darwin Reel Editor</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #151516; color: #EDF6FF; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; font-size: 13px; }
  .hidden { display: none !important; }
  kbd { background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font-size: 10px; }

  /* ── layout shell ── */
  .app { height: 100%; display: grid; grid-template-rows: 50px 1fr 200px; grid-template-columns: minmax(0, 1fr); }
  .app > * { min-width: 0; }
  .topbar { background: #1f1f22; border-bottom: 1px solid #2a2a2e; padding: 0 16px; display: flex; align-items: center; gap: 12px; }
  .topbar-brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: #EDF6FF; }
  .topbar-logo { width: 26px; height: 26px; background: #003B73; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-family: serif; }
  .topbar-title { font-size: 13px; font-weight: 600; }
  .topbar-name { font-size: 12px; color: #94a3b8; }
  .spacer { flex: 1; }
  .btn { background: #232327; color: #EDF6FF; border: 1px solid #383840; padding: 7px 13px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn:hover { background: #2e2e32; }
  .btn.primary { background: #0183FF; border-color: #0183FF; color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #0166CC; }
  .btn.primary:disabled { background: #2a4a6a; border-color: #2a4a6a; color: #88a; cursor: default; }
  .btn.ghost { background: transparent; border-color: transparent; color: #94a3b8; }
  .btn.ghost:hover { background: #232327; color: #EDF6FF; }
  .btn.sm { padding: 4px 8px; font-size: 11px; }
  .status-pill { font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 600; }
  .status-pill.editing { background: rgba(1,131,255,0.15); color: #66B0FF; }
  .status-pill.rendering { background: rgba(247,181,56,0.16); color: #F7B538; }
  .status-pill.complete { background: rgba(46,184,114,0.16); color: #4ADE80; }
  .status-pill.failed { background: rgba(239,68,68,0.16); color: #F87171; }

  .body { display: grid; grid-template-columns: 252px 1fr 268px; min-height: 0; }
  .rail { background: #1a1a1c; overflow-y: auto; padding: 14px 0; }
  .rail.left { border-right: 1px solid #2a2a2e; }
  .rail.right { border-left: 1px solid #2a2a2e; }
  .rail-title { padding: 0 14px 8px; font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .rail-sec { margin-bottom: 18px; }
  .asset-row { margin: 0 14px 8px; background: #232327; border: 1px solid #2a2a2e; border-radius: 7px; padding: 9px 10px; }
  .asset-row .name { font-size: 12px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Menlo, monospace; }
  .asset-row .sub { font-size: 10px; color: #6b7280; margin-top: 2px; }
  .asset-actions { display: flex; gap: 5px; margin-top: 7px; }
  .stock-row { display: flex; align-items: center; gap: 8px; margin: 0 14px 6px; background: #232327; border: 1px solid #2a2a2e; border-radius: 7px; padding: 7px 9px; }
  .stock-row.active { border-color: #0183FF; }
  .stock-idx { width: 20px; height: 20px; border-radius: 50%; background: rgba(1,131,255,0.15); color: #66B0FF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 20px; }
  .stock-row .name { flex: 1; font-size: 11px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Menlo, monospace; }
  .icon-btn { background: transparent; border: 0; color: #6b7280; cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .icon-btn:hover { color: #66B0FF; }
  .icon-btn.del:hover { color: #F87171; }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }
  textarea.script { width: calc(100% - 28px); margin: 0 14px; min-height: 150px; resize: vertical; background: #131316; color: #cbd5e1; border: 1px solid #2a2a2e; border-radius: 7px; padding: 9px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.55; }
  textarea.script:focus { outline: none; border-color: #0183FF; }

  /* ── stage / preview ── */
  .stage { display: flex; flex-direction: column; min-width: 0; background: #151516; }
  .stage-pad { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 14px; }
  .frame { position: relative; aspect-ratio: 1080 / 1920; height: min(100%, 560px); background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  .frame video { position: absolute; background: #000; }
  .slot { position: absolute; overflow: hidden; z-index: 2; }
  .slot.selectable { cursor: move; }
  .slot.sel { outline: 2px solid #0183FF; outline-offset: -2px; z-index: 4; }
  .slot video { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #3a4654; font-family: Inter, system-ui, sans-serif; font-size: 12px; background: #11161d; z-index: 1; }
  .frame .ph.hidden { display: none; }
  .tl-edge { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 3; background: transparent; }
  .tl-edge.l { left: 0; } .tl-edge.r { right: 0; }
  .tl-block:hover .tl-edge { background: rgba(255,255,255,0.35); }
  .frame .cap { position: absolute; left: 6%; right: 6%; display: flex; justify-content: center; pointer-events: none; z-index: 6; }
  .frame .cap span { background: rgba(0,0,0,0.55); border-radius: 10px; color: #fff; text-align: center; line-height: 1.25; padding: 2.2% 4%; max-width: 88%; max-height: 30%; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; pointer-events: auto; cursor: grab; }
  .frame .cap span:active { cursor: grabbing; }
  .edge { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,0.18); pointer-events: none; z-index: 5; }

  .transport { display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-top: 1px solid #2a2a2e; background: #18181b; }
  .play-btn { width: 34px; height: 34px; border-radius: 50%; background: #0183FF; border: 0; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .play-btn:hover { background: #0166CC; }
  .time-read { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #94a3b8; }
  .seg-read { font-size: 11px; color: #6b7280; }

  /* ── inspector ── */
  .insp-empty { padding: 28px 16px; color: #6b7280; font-size: 12px; text-align: center; }
  .insp-sec { padding: 0 16px 16px; }
  .insp-h { font-size: 11px; color: #cbd5e1; font-weight: 700; margin: 14px 0 4px; }
  .insp-meta { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
  .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .layout-opt { background: #232327; border: 1px solid #2a2a2e; border-radius: 8px; padding: 8px; cursor: pointer; text-align: center; }
  .layout-opt:hover { border-color: #383840; background: #2a2a2e; }
  .layout-opt.active { border-color: #0183FF; background: rgba(1,131,255,0.1); }
  .layout-ico { width: 30px; height: 53px; margin: 0 auto 6px; border-radius: 3px; overflow: hidden; border: 1px solid #383840; display: flex; flex-direction: column; }
  .layout-ico div { flex: 1; }
  .layout-ico .d { background: #0183FF; }
  .layout-ico .s { background: #0A7C6B; }
  .layout-name { font-size: 10px; color: #cbd5e1; }
  .layout-opt.active .layout-name { color: #66B0FF; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-weight: 700; }
  .field input[type=range] { width: 100%; }
  .field .val { font-size: 11px; color: #94a3b8; font-family: ui-monospace, Menlo, monospace; }
  .num-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .num-row .field { margin-bottom: 8px; }
  .num-row input[type=number] { width: 100%; background: #232327; border: 1px solid #2a2a2e; border-radius: 6px; color: #EDF6FF; padding: 5px 7px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .reset-link { color: #66B0FF; font-size: 11px; cursor: pointer; background: none; border: 0; padding: 0; }

  /* ── timeline ── */
  .timeline { background: #18181b; border-top: 1px solid #2a2a2e; display: flex; flex-direction: column; min-height: 0; }
  .tl-toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-bottom: 1px solid #232327; }
  .tl-toolbar .lbl { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .tl-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; }
  .tl-inner { position: relative; min-width: 100%; }
  .tl-ruler { height: 22px; position: relative; border-bottom: 1px solid #232327; cursor: pointer; }
  .tl-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #2a2a2e; padding-left: 4px; font-size: 9px; color: #6b7280; font-family: ui-monospace, Menlo, monospace; }
  .tl-row { height: 42px; display: flex; align-items: stretch; border-bottom: 1px solid #1f1f22; position: relative; }
  .tl-rowlabel { position: sticky; left: 0; z-index: 6; width: 78px; flex: 0 0 78px; background: #1a1a1c; border-right: 1px solid #232327; display: flex; align-items: center; padding: 0 10px; font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
  .tl-lane { position: relative; flex: 1; }
  .tl-block { position: absolute; top: 5px; bottom: 5px; border-radius: 4px; cursor: pointer; overflow: hidden; display: flex; align-items: center; padding: 0 7px; font-size: 10px; color: #fff; white-space: nowrap; }
  .tl-block.full-darwin { background: #2b3340; color: #94a3b8; border: 1px solid #384150; }
  .tl-block.stock-top { background: rgba(1,131,255,0.32); border: 1px solid #0183FF; }
  .tl-block.darwin-top { background: rgba(124,58,237,0.32); border: 1px solid #7C3AED; }
  .tl-block.full-stock { background: rgba(10,124,107,0.4); border: 1px solid #0A7C6B; }
  .tl-block.selected { box-shadow: 0 0 0 2px #fff inset; }
  .tl-block.narr { background: rgba(1,131,255,0.16); border: 1px solid #2a557f; color: #66B0FF; top: 8px; bottom: 8px; }
  .tl-block.music { background: rgba(247,181,56,0.16); border: 1px solid #6b5520; color: #F7B538; top: 10px; bottom: 10px; }
  .tl-playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #FC6A6B; z-index: 8; pointer-events: none; box-shadow: 0 0 6px rgba(252,106,107,0.6); }
  .tl-playhead-grip { position: absolute; top: 0; width: 11px; height: 22px; margin-left: -5px; background: transparent; cursor: ew-resize; z-index: 9; }
  .tl-dim { position: absolute; top: 22px; bottom: 0; background: repeating-linear-gradient(45deg, rgba(0,0,0,0.55), rgba(0,0,0,0.55) 6px, rgba(20,20,22,0.55) 6px, rgba(20,20,22,0.55) 12px); z-index: 7; pointer-events: none; }
  .tl-trim { position: absolute; top: 22px; bottom: 0; width: 10px; margin-left: -5px; z-index: 10; cursor: ew-resize; }
  .tl-trim::before { content: ''; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: #2AB397; }
  .tl-trim::after { content: ''; position: absolute; left: 0; top: calc(50% - 9px); width: 10px; height: 18px; border-radius: 3px; background: #2AB397; }
  .tl-trim.right::before { left: 4px; }

  .toast { position: fixed; bottom: 18px; right: 18px; background: #232327; border: 1px solid #383840; color: #EDF6FF; padding: 10px 16px; border-radius: 8px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 100; opacity: 0; transform: translateY(8px); transition: all .2s; }
  /* trim preview popup */
  .trim-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.66); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .trim-modal.hidden { display: none; }
  .trim-panel { background: #1a1a1c; border: 1px solid #2a2a2e; border-radius: 12px; width: min(680px, 92vw); padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .trim-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 700; color: #EDF6FF; font-size: 13px; }
  .trim-head button { background: none; border: 0; color: #94a3b8; font-size: 22px; line-height: 1; cursor: pointer; }
  .trim-video-wrap { background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 200px; }
  .trim-video-wrap video { max-height: 44vh; max-width: 100%; display: block; }
  .trim-controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .trim-bar { position: relative; flex: 1; height: 38px; background: #232327; border-radius: 6px; cursor: pointer; user-select: none; }
  .trim-dim { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,0.55); border-radius: 6px; pointer-events: none; }
  .trim-sel { position: absolute; top: 0; bottom: 0; border: 2px solid #2AB397; border-radius: 6px; pointer-events: none; }
  .trim-handle { position: absolute; top: -2px; bottom: -2px; width: 14px; margin-left: -7px; background: #2AB397; border-radius: 4px; cursor: ew-resize; z-index: 3; box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .trim-ph { position: absolute; top: 0; bottom: 0; width: 2px; background: #FC6A6B; z-index: 2; pointer-events: none; }
  .trim-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .btn.primary { background: #0183FF; color: #fff; border-color: #0183FF; }
  .btn.primary:hover { background: #0166CC; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: #7f2a2a; }
  .toast.success { border-color: #2a7f4a; }
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <a class="topbar-brand" href="darwin.html"><span class="topbar-logo">d</span><span class="topbar-title">Darwin Reel Editor</span></a>
    <span class="topbar-name" id="reelName"></span>
    <div class="spacer"></div>
    <span class="status-pill editing" id="statusPill">Editing</span>
    <a href="darwin.html" class="btn ghost">All reels</a>
    <a class="btn hidden" id="dlBtn" download>Download MP4</a>
    <button class="btn primary" id="renderBtn">Render</button>
  </div>

  <!-- BODY -->
  <div class="body">
    <!-- LEFT RAIL: assets + script -->
    <div class="rail left">
      <div class="rail-sec">
        <div class="rail-title">Darwin video</div>
        <div class="asset-row">
          <div class="name" id="darwinName">none</div>
          <div class="sub" id="darwinSub"></div>
          <div class="asset-actions">
            <button class="btn sm" id="swapDarwin">Swap video</button>
          </div>
        </div>
        <input type="file" id="fDarwin" accept="video/*" class="hidden" />
      </div>

      <div class="rail-sec">
        <div class="rail-title">Stock clips <span id="stockCount" style="color:#6b7280"></span></div>
        <div id="stockList"></div>
        <button class="btn sm" id="addStock" style="margin:2px 14px;">+ Add stock</button>
        <input type="file" id="fStock" accept="video/*" multiple class="hidden" />
        <input type="file" id="fSwapStock" accept="video/*" class="hidden" />
      </div>

      <div class="rail-sec">
        <div class="rail-title">Music</div>
        <div class="asset-row">
          <div class="name" id="musicName">none</div>
          <div class="asset-actions">
            <button class="btn sm" id="swapMusic">Set music</button>
            <button class="btn sm hidden" id="rmMusic">Remove</button>
          </div>
        </div>
        <input type="file" id="fMusic" accept="audio/*" class="hidden" />
      </div>

      <div class="rail-sec">
        <div class="rail-title">Script <span style="color:#6b7280">from doc, or edit below</span></div>
        <div style="margin:0 14px 8px"><button class="btn sm" id="importDocx" style="width:100%">Import .docx (footage column = split)</button></div>
        <input type="file" id="fDocxEditor" accept=".docx" class="hidden" />
        <textarea class="script" id="scriptText" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- STAGE: preview -->
    <div class="stage">
      <div class="stage-pad">
        <div class="frame" id="frame">
          <div class="slot" id="dSlot"><video id="darwinVid" muted playsinline></video><div class="ph hidden" id="dPh"></div></div>
          <div class="slot" id="sSlot"><video id="stockVid" muted playsinline></video><div class="ph hidden" id="sPh"></div></div>
          <div class="edge" id="edge"></div>
          <div class="cap hidden" id="capBar"><span id="capText"></span></div>
        </div>
      </div>
      <div class="transport">
        <button class="play-btn" id="playBtn">&#9658;</button>
        <span class="time-read" id="timeRead">0:00 / 0:00</span>
        <span class="seg-read" id="segRead"></span>
        <div class="spacer"></div>
        <label class="seg-read" style="display:flex;gap:6px;align-items:center;"><input type="checkbox" id="loopChk" /> loop</label>
      </div>
    </div>

    <!-- RIGHT RAIL: inspector -->
    <div class="rail right" id="inspector"></div>
  </div>

  <!-- TIMELINE -->
  <div class="timeline">
    <div class="tl-toolbar">
      <span class="lbl">Timeline</span>
      <button class="btn ghost sm" id="zoomOut">&#8722;</button>
      <button class="btn ghost sm" id="zoomIn">+</button>
      <button class="btn ghost sm" id="undoBtn" title="Undo (Cmd+Z)" disabled>&#8634; Undo</button>
      <button class="btn ghost sm" id="redoBtn" title="Redo (Cmd+Shift+Z)" disabled>&#8635; Redo</button>
      <span class="seg-read" id="tlHint">click a split block to change its layout</span>
    </div>
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-inner" id="tlInner"></div>
    </div>
  </div>
</div>

<audio id="musicAud"></audio>
<div class="toast" id="toast"></div>

<div class="trim-modal hidden" id="trimModal">
  <div class="trim-panel">
    <div class="trim-head"><span id="trimTitle">Trim clip</span><button id="trimClose" title="close">&times;</button></div>
    <div class="trim-video-wrap"><video id="trimVid" muted playsinline></video></div>
    <div class="trim-controls">
      <button class="play-btn" id="trimPlay" style="flex:0 0 auto">&#9658;</button>
      <span class="time-read" id="trimTime">0:00 / 0:00</span>
      <div class="trim-bar" id="trimBar">
        <div class="trim-dim" id="trimDimL"></div>
        <div class="trim-dim" id="trimDimR"></div>
        <div class="trim-sel" id="trimSel"></div>
        <div class="trim-ph" id="trimPhEl"></div>
        <div class="trim-handle" id="trimHIn" title="start"></div>
        <div class="trim-handle" id="trimHOut" title="end"></div>
      </div>
    </div>
    <div class="trim-foot">
      <span class="seg-read" id="trimRead"></span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn sm" id="trimCancel">Cancel</button>
      <button class="btn sm primary" id="trimSave">Done</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="js/darwin-parser.js"></script>
<script src="js/darwin-api.js"></script>
<script>
// =============================================================================
// State
// =============================================================================
const qs = new URLSearchParams(location.search);
const PROJECT_ID = qs.get('id');
const $ = (id) => document.getElementById(id);

const state = {
  project: null,
  darwinUrl: null, stockUrls: [], musicUrl: null,
  segments: [], captions: [],
  selectedSplit: null,        // stockIndex of the selected split, or null
  selectedClip: null,         // transform target key: stock-{k} | dhalf-{k} | dfull
  pxPerSec: 56,
  playing: false,
  saveTimer: null,
  pollTimer: null,
};

function toast(msg, kind = '') { const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + kind; setTimeout(() => t.className = 'toast ' + kind, 2600); }
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(sec){sec=Math.max(0,sec||0);const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`;}

const p = () => state.project;
const total = () => p()?.totalDuration || state.segments[state.segments.length-1]?.end || 0;

// ── Trim/cut (source time) ──────────────────────────────────────────────────
// state.trimIn / state.trimOut define the single kept range against the source
// take. darwinClips on the project carries the N-clip model; trim-first uses one
// clip. The timeline axis stays source time; trimmed parts are dimmed; preview
// plays only [trimIn, trimOut]; the render remaps to output time on the worker.
function initTrim() {
  const clips = p().darwinClips || [];
  if (clips.length) { state.trimIn = clips[0].srcStart || 0; state.trimOut = clips[clips.length - 1].srcEnd || total(); }
  else { state.trimIn = 0; state.trimOut = total(); }
}
function isTrimmed() { return state.trimIn > 0.01 || state.trimOut < total() - 0.01; }
function outputDuration() { return Math.max(0, state.trimOut - state.trimIn); }
function saveTrim() {
  const clips = isTrimmed() ? [{ srcStart: +state.trimIn.toFixed(2), srcEnd: +state.trimOut.toFixed(2) }] : [];
  patch({ darwinClips: clips });
}
function resetTrim() { state.trimIn = 0; state.trimOut = total(); saveTrim(); renderTimeline(); paint(); }

// =============================================================================
// Load
// =============================================================================
async function boot() {
  if (!PROJECT_ID) { document.body.innerHTML = '<div style="padding:40px;color:#94a3b8">No reel id in URL.</div>'; return; }
  try {
    state.project = await DarwinAPI.get(PROJECT_ID);
  } catch (e) { document.body.innerHTML = `<div style="padding:40px;color:#F87171">Could not load reel: ${escapeHtml(e.message)}</div>`; return; }

  $('reelName').textContent = p().title || 'Untitled reel';
  $('scriptText').value = p().scriptText || '';
  setStatus(p().status || 'editing');

  await resolveAssetUrls();
  rebuildSegments();
  if ((p().darwinClips || []).length) patch({ darwinClips: [] }); // remove any stray reel-trim
  renderAssets();
  renderTimeline();
  renderInspector();
  wireMedia();
  initPreviewInteract();
  wireDocImport();
  wireTrimPopup();
  wireCaptionDrag();
  // Backfill duration if missing, once the darwin video reports metadata.
  maybeBackfillDuration();
  paint(); // draw frame 0 (sets edge visibility, time readout, playhead) before first play
  if (p().status === 'rendering') startPolling();
  undoReady = true; // start recording undo history only after the project is loaded
}

async function resolveAssetUrls() {
  const proj = p();
  state.darwinUrl = await safeAssetUrl(proj.darwinS3Key);
  state.stockUrls = [];
  for (const k of (proj.stockS3Keys || [])) state.stockUrls.push(await safeAssetUrl(k));
  state.musicUrl = proj.musicS3Key ? await safeAssetUrl(proj.musicS3Key) : null;
}
async function safeAssetUrl(key) {
  if (!key) return null;
  try { return await DarwinAPI.assetGetUrl(PROJECT_ID, key); }
  catch (e) { console.warn('asset url failed for', key, e.message); return null; }
}

function rebuildSegments() {
  const parsed = parseDarwinScript(p().scriptText || '', { totalDuration: p().totalDuration || null });
  state.segments = buildRenderPlan(parsed, {
    totalDuration: p().totalDuration || 0,
    defaultLayout: p().defaultLayout || 'stock-top',
    layoutOverrides: p().layoutOverrides || {},
  });
  state.captions = parsed.captions;
  state.stockClipsNeeded = parsed.stockClipsNeeded;
}

// =============================================================================
// Media wiring + preview render loop (mirrors DarwinReel.tsx)
// =============================================================================
const darwinVid = $('darwinVid'), stockVid = $('stockVid'), musicAud = $('musicAud');
const dSlot = $('dSlot'), sSlot = $('sSlot');

function wireMedia() {
  if (state.darwinUrl) darwinVid.src = state.darwinUrl;
  if (state.musicUrl) { musicAud.src = state.musicUrl; musicAud.volume = (typeof p().musicVolume === 'number') ? p().musicVolume : 0.15; }
  darwinVid.muted = false; // Darwin is the audio spine
  stockVid.muted = true;   // stock is always muted by design
  darwinVid.addEventListener('timeupdate', () => { if (!state.playing) paint(); });
  darwinVid.addEventListener('ended', () => { stopPlayback(); if ($('loopChk').checked) { seek(0); play(); } });
  requestAnimationFrame(loop);
}

let lastStockIndex = -2;
function activeSegment(t) {
  const segs = state.segments;
  for (const s of segs) if (t >= s.start && t < s.end) return s;
  return segs[segs.length - 1] || { start: 0, end: total(), layout: 'full-darwin', stockIndex: null };
}

// ── Per-clip transforms (scale/position on any clip; trim on stock only) ──────
// Stored per placed instance on project.clipTransforms, keyed:
//   stock-{k}  stock clip in split k  (scale, x, y, trimIn, trimOut)
//   dhalf-{k}  Darwin half in split k (scale, x, y)
//   dfull      full-frame Darwin, global (scale, x, y)
// x/y are percent offsets; scale is a multiplier on an object-fit:cover element.
function clipTx(key) {
  const t = (p().clipTransforms || {})[key] || {};
  // scale clamped >= 1 (zoom in only). To show the WHOLE frame uncut, use fit:'contain'.
  return { scale: Math.max(1, t.scale != null ? t.scale : 1), x: t.x || 0, y: t.y || 0, trimIn: t.trimIn || 0, trimOut: t.trimOut || 0, fit: t.fit === 'contain' ? 'contain' : 'cover' };
}
function setClipTx(key, fields) {
  const m = { ...(p().clipTransforms || {}) };
  m[key] = { ...clipTx(key), ...fields };
  patch({ clipTransforms: m });
}
function resetClipTx(key) {
  const m = { ...(p().clipTransforms || {}) };
  delete m[key];
  patch({ clipTransforms: m });
  lastStockIndex = -2; applyTransforms(); paint(); renderInspector();
}
function txCss(key) { const t = clipTx(key); return `translate(${t.x}%, ${t.y}%) scale(${t.scale})`; }
function darwinKey(seg) { return (seg && (seg.layout === 'stock-top' || seg.layout === 'darwin-top') && seg.stockIndex != null) ? `dhalf-${seg.stockIndex}` : 'dfull'; }
function stockKey(seg) { return (seg && seg.stockIndex != null) ? `stock-${seg.stockIndex}` : null; }

function applyTransforms() {
  const seg = activeSegment(darwinVid.src ? darwinVid.currentTime : 0);
  const dk = darwinKey(seg), sk = stockKey(seg);
  darwinVid.style.transformOrigin = 'center center';
  darwinVid.style.transform = txCss(dk);
  if (sk) { stockVid.style.transformOrigin = 'center center'; stockVid.style.transform = txCss(sk); }
  $('dSlot').classList.toggle('sel', state.selectedClip === dk);
  $('sSlot').classList.toggle('sel', sk != null && state.selectedClip === sk);
  $('dSlot').classList.toggle('selectable', dSlot.style.display !== 'none');
  $('sSlot').classList.toggle('selectable', sSlot.style.display !== 'none');
}

function applyLayout(seg, t) {
  const dv = darwinVid, sv = stockVid;
  const hasDarwin = !!state.darwinUrl;
  const stockUrl = seg.stockIndex != null ? state.stockUrls[seg.stockIndex] : null;
  const dKey = darwinKey(seg), sKey = seg.stockIndex != null ? `stock-${seg.stockIndex}` : null;
  const dFit = clipTx(dKey).fit, sFit = sKey ? clipTx(sKey).fit : 'cover';
  $('edge').style.display = (seg.layout === 'stock-top' || seg.layout === 'darwin-top') ? 'block' : 'none';
  showPh(seg, hasDarwin, stockUrl);

  // stock element source management, honoring stock trim in/out
  if (stockUrl) {
    const sk = `stock-${seg.stockIndex}`;
    const tin = clipTx(sk).trimIn, tout = clipTx(sk).trimOut;
    const want = tin + (t - seg.start);
    const clamped = (tout > tin) ? Math.min(want, tout) : want;
    if (seg.stockIndex !== lastStockIndex) { sv.src = stockUrl; try { sv.currentTime = Math.max(0, clamped); } catch (_){} lastStockIndex = seg.stockIndex; if (state.playing) sv.play().catch(()=>{}); }
    else { if (Math.abs(sv.currentTime - clamped) > 0.3) { try { sv.currentTime = Math.max(0, clamped); } catch(_){} } }
  } else { lastStockIndex = -2; }

  const FULL = { top: '0', left: '0', width: '100%', height: '100%' };
  const TOP  = { top: '0', left: '0', width: '100%', height: '50%' };
  const BOT  = { top: '50%', left: '0', width: '100%', height: '50%' };
  const setSlot = (slot, vid, box, fit, pos, z, show) => {
    slot.style.display = show ? 'block' : 'none';
    if (!show) return;
    slot.style.top = box.top; slot.style.left = box.left; slot.style.width = box.width; slot.style.height = box.height; slot.style.zIndex = z;
    vid.style.objectFit = fit; vid.style.objectPosition = pos;
  };

  if (seg.layout === 'full-darwin') {
    setSlot(dSlot, dv, FULL, dFit, '50% 0%', 1, true);
    setSlot(sSlot, sv, FULL, sFit, '50% 50%', 0, false);
  } else if (seg.layout === 'full-stock') {
    setSlot(dSlot, dv, FULL, dFit, '50% 0%', 1, true);   // stays for audio, covered
    setSlot(sSlot, sv, FULL, sFit, '50% 50%', 2, true);
  } else if (seg.layout === 'stock-top') {
    setSlot(sSlot, sv, TOP, sFit, '50% 50%', 2, true);
    setSlot(dSlot, dv, BOT, dFit, '50% 0%', 2, true);
  } else if (seg.layout === 'darwin-top') {
    setSlot(dSlot, dv, TOP, dFit, '50% 0%', 2, true);
    setSlot(sSlot, sv, BOT, sFit, '50% 50%', 2, true);
  }
}

function showPh(seg, hasDarwin, stockUrl) {
  // placeholders live INSIDE each slot, so a missing stock clip never covers the Darwin half
  const needDarwin = seg.layout !== 'full-stock' && !hasDarwin;
  const needStock = (seg.layout !== 'full-darwin') && !stockUrl;
  const dPh = $('dPh'), sPh = $('sPh');
  dPh.classList.toggle('hidden', !needDarwin);
  if (needDarwin) { dPh.textContent = 'Darwin video unavailable'; }
  sPh.classList.toggle('hidden', !needStock);
  if (needStock) {
    const hint = (p().footageHints || [])[seg.stockIndex] || '';
    const n = seg.stockIndex != null ? seg.stockIndex + 1 : '';
    sPh.innerHTML = `<div style="text-align:center;padding:0 8%;cursor:pointer">
      <div style="font-weight:600;color:#5b6b7d">+ Tap to add stock ${n}</div>
      ${hint ? `<div style="font-size:11px;margin-top:5px;color:#3a4654;line-height:1.35">${escapeHtml(hint.slice(0, 64))}${hint.length > 64 ? '\u2026' : ''}</div>` : ''}</div>`;
    sPh.style.cursor = 'pointer';
    sPh.onclick = () => $('fStock').click();
  } else { sPh.onclick = null; }
}

function paint() {
  const t = darwinVid.src ? darwinVid.currentTime : 0;
  const seg = activeSegment(t);
  applyLayout(seg, t);
  // captions
  const cap = state.captions.find(c => t >= c.start && t < c.end);
  const bar = $('capBar');
  if (cap && cap.text) {
    const cs = p().captionStyle || {};
    const frameH = $('frame').getBoundingClientRect().height || 560;
    const scale = frameH / 1920;
    bar.classList.remove('hidden');
    $('capText').textContent = cap.text;
    $('capText').style.fontSize = Math.max(8, (cs.fontSize || 52) * scale) + 'px';
    $('capText').style.fontWeight = cs.fontWeight || 700;
    $('capText').style.fontFamily = cs.fontFamily || 'Inter, system-ui, sans-serif';
    $('capText').style.color = cs.color || '#fff';
    const pos = cs.position || 'bottom';
    if (pos === 'top') { bar.style.top = (180 * scale) + 'px'; bar.style.bottom = 'auto'; bar.style.transform = 'none'; }
    else if (pos === 'center') { bar.style.top = '50%'; bar.style.bottom = 'auto'; bar.style.transform = 'translateY(-50%)'; }    else { bar.style.bottom = ((cs.bottom != null ? cs.bottom : 220) * scale) + 'px'; bar.style.top = 'auto'; bar.style.transform = 'none'; }
  } else { bar.classList.add('hidden'); }
  // readouts + playhead
  $('timeRead').textContent = `${fmtTime(t)} / ${fmtTime(total())}`;
  $('segRead').textContent = `${seg.layout}${seg.stockIndex != null ? ` (stock ${seg.stockIndex + 1})` : ''}`;
  movePlayhead(t);
  applyTransforms();
}

function loop() {
  if (state.playing) {
    if (darwinVid.src && darwinVid.currentTime >= total() - 0.05) {
      if ($('loopChk') && $('loopChk').checked) { seek(0); }
      else { stopPlayback(); }
    } else paint();
  }
  requestAnimationFrame(loop);
}

// transport
function play() {
  if (!darwinVid.src) return;
  state.playing = true; $('playBtn').innerHTML = '&#10073;&#10073;';
  darwinVid.play().catch(()=>{});
  if (state.musicUrl) { musicAud.currentTime = darwinVid.currentTime; musicAud.play().catch(()=>{}); }
  const seg = activeSegment(darwinVid.currentTime);
  if (seg.stockIndex != null && stockVid.src) stockVid.play().catch(()=>{});
}
function stopPlayback() { state.playing = false; $('playBtn').innerHTML = '&#9658;'; darwinVid.pause(); stockVid.pause(); musicAud.pause(); }
function togglePlay() { state.playing ? stopPlayback() : play(); }
function seek(t) {
  t = Math.max(0, Math.min(total(), t));
  if (darwinVid.src) darwinVid.currentTime = t;
  if (state.musicUrl) musicAud.currentTime = t;
  lastStockIndex = -2; // force stock re-sync
  paint();
}
$('playBtn').onclick = togglePlay;
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') { e.preventDefault(); togglePlay(); } });

// =============================================================================
// Assets rail
// =============================================================================
function renderAssets() {
  $('darwinName').textContent = p().darwinName || (p().darwinS3Key ? 'darwin video' : 'none');
  $('darwinSub').textContent = total() ? `duration ${fmtTime(total())}` : 'duration pending';
  // stock list: one row per split slot, footage hint inline (no separate block)
  const keys = p().stockS3Keys || [], names = p().stockNames || [];
  const hints = p().footageHints || [];
  const needed = state.stockClipsNeeded || 0;
  $('stockCount').textContent = `(${keys.length}/${needed} needed)`;
  const n = Math.max(needed, keys.length);
  const rows = [];
  for (let i = 0; i < n; i++) {
    const has = i < keys.length && keys[i];
    const hint = hints[i] || '';
    if (has) {
      rows.push(`
    <div class="stock-row ${state.selectedSplit === i ? 'active' : ''}">
      <span class="stock-idx">${i + 1}</span>
      <span class="name" title="${escapeHtml(names[i] || keys[i])}">${escapeHtml(names[i] || 'clip ' + (i + 1))}</span>
      <button class="icon-btn" title="trim" onclick="openTrimPopup(${i})">&#9986;</button>
      <button class="icon-btn" title="up" onclick="moveStock(${i},-1)" ${i === 0 ? 'disabled' : ''}>&#9650;</button>
      <button class="icon-btn" title="down" onclick="moveStock(${i},1)" ${i >= keys.length - 1 ? 'disabled' : ''}>&#9660;</button>
      <button class="icon-btn" title="replace" onclick="swapStock(${i})">&#8635;</button>
      <button class="icon-btn del" title="delete" onclick="deleteStock(${i})">&times;</button>
    </div>${hint ? `<div class="insp-meta" style="padding:1px 14px 7px 42px">${escapeHtml(hint)}</div>` : ''}`);
    } else {
      const isNext = i === keys.length;
      rows.push(`
    <div class="stock-row" style="${isNext ? '' : 'opacity:.55'}">
      <span class="stock-idx" style="background:#232327;color:#6b7280">${i + 1}</span>
      <span class="name" style="color:#6b7280" title="${escapeHtml(hint)}">${hint ? escapeHtml(hint.slice(0, 42)) : 'empty slot'}</span>
      ${isNext ? `<button class="icon-btn" title="add clip for this slot" onclick="$('fStock').click()" style="width:auto;padding:0 8px">+ add</button>` : ''}
    </div>`);
    }
  }
  $('stockList').innerHTML = rows.join('') || '<div class="insp-meta" style="padding:0 14px">no splits yet, import a doc or add /split markers in the script</div>';
  $('musicName').textContent = p().musicName || 'none';
  $('rmMusic').classList.toggle('hidden', !p().musicS3Key);
}

// =============================================================================
// Inspector: split layout switcher OR reel properties
// =============================================================================
const LAYOUTS = [
  { id: 'stock-top',   name: 'Stock top',   ico: '<div class="s"></div><div class="d"></div>' },
  { id: 'darwin-top',  name: 'Darwin top',  ico: '<div class="d"></div><div class="s"></div>' },
  { id: 'full-darwin', name: 'Full Darwin', ico: '<div class="d"></div>' },
  { id: 'full-stock',  name: 'Full stock',  ico: '<div class="s"></div>' },
];
function effectiveLayout(stockIndex) {
  const ov = p().layoutOverrides || {};
  return ov[stockIndex] || p().defaultLayout || 'stock-top';
}
function renderInspector() {
  const insp = $('inspector');
  if (state.selectedClip) { renderClipInspector(insp, state.selectedClip); return; }
  if (state.selectedSplit != null) {
    const idx = state.selectedSplit;

      <div class="insp-sec">
        <div class="insp-h">Split ${idx + 1}</div>

        <div class="layout-grid">
          ${LAYOUTS.map(l => `
            <div class="layout-opt ${cur === l.id ? 'active' : ''}" onclick="setLayout(${idx},'${l.id}')">

      </div>`;
  } else {

    insp.innerHTML = `
      <div class="insp-sec">

            ${LAYOUTS.filter(l=>l.id!=='full-darwin').map(l => `<option value="${l.id}" ${(p().defaultLayout||'stock-top')===l.id?'selected':''}>${l.name}</option>`).join('')}
          </select>

        </div>

          <select id="capPos" class="btn" style="width:100%">
            ${[['bottom','Bottom'],['center','Center'],['top','Top'],['custom','Custom (dragged)']].map(([v,n])=>`<option value="${v}" ${((p().captionStyle||{}).position||'bottom')===v?'selected':''}>${n}</option>`).join('')}
          </select>

    const dl = $('defLayout'); if (dl) dl.onchange = () => { patch({ defaultLayout: dl.value }); rebuildSegments(); renderTimeline(); paint(); };
    const mr = $('mvRange'); if (mr) mr.oninput = () => { const v = mr.value / 100; $('mvVal').textContent = mr.value + '%'; musicAud.volume = v; patch({ musicVolume: v }); };
    const cp = $('capPos'); if (cp) cp.onchange = () => { const v = cp.value; patch({ captionStyle: { ...(p().captionStyle||{}), position: v, bottom: v === 'bottom' ? 220 : (p().captionStyle||{}).bottom } }); paint(); };
  }
}

function selectSplit(idx) { state.selectedSplit = idx; state.selectedClip = `stock-${idx}`; renderInspector(); renderAssets(); renderTimeline(); const seg = state.segments.find(s => s.stockIndex === idx); if (seg) seek(seg.start); }
function clearSelection() { state.selectedSplit = null; state.selectedClip = null; renderInspector(); renderAssets(); renderTimeline(); applyTransforms(); }

function renderClipInspector(insp, key) {

  const idx = (isStock || isDHalf) ? parseInt(key.split('-')[1], 10) : null;
  const t = clipTx(key);

  const trimRow = isStock ? `

  const capInfo = (idx != null) ? splitCaptionLine(idx) : null;
  const capEditor = (idx != null) ? `
      <div class="insp-h">Caption</div>

  insp.innerHTML = `

      <div class="insp-h">Frame</div>
      <div class="layout-grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">
        <div class="layout-opt ${t.fit !== 'contain' ? 'active' : ''}" onclick="setClipFit('${key}','cover')"><div class="layout-name">Fill (crop to edges)</div></div>
        <div class="layout-opt ${t.fit === 'contain' ? 'active' : ''}" onclick="setClipFit('${key}','contain')"><div class="layout-name">Fit (whole, uncut)</div></div>
      </div>

  const tb = $('txTrimBtn'); if (tb) tb.onclick = () => openTrimPopup(idx);

// =============================================================================
// Trim preview popup (stock clips only): shows the clip with draggable
// in/out handles over a scrubbable bar, so you set the range by eye.
// =============================================================================
const trimState = { index: null, dur: 0, in: 0, out: 0, playing: false };
const trimVidEl = $('trimVid');
function openTrimPopup(idx) {
  if (idx == null) return;
  const url = state.stockUrls[idx];
  if (!url) { toast('Add this stock clip first, then trim', 'error'); return; }
  const t = clipTx(`stock-${idx}`);
  trimState.index = idx;
  const seg = state.segments.find(s => s.stockIndex === idx);

function docHtmlToRows(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const table = doc.querySelector('table');
  if (!table) return [];
  const rows = [];
  Array.from(table.querySelectorAll('tr')).forEach((tr, idx) => {
    const cells = Array.from(tr.querySelectorAll('td,th')).map(c => c.textContent.trim());
    if (!cells.length) return;
    const joined = cells.join(' ').toLowerCase();
    if (idx === 0 && /script|footage|suggested|^#/.test(joined)) return; // header
    let line, footage;
    if (cells.length >= 3) { line = cells[1]; footage = cells[2]; }
    else if (cells.length === 2) { line = cells[0]; footage = cells[1]; }
    else { line = cells[0]; footage = ''; }
    rows.push({ line, footage });
  });
  return rows;
}

// locate / edit the on-screen caption text for split idx (its line in the script)
function splitCaptionLine(idx) {
  const lines = (p().scriptText || '').split(/\r?\n/);
  let n = -1;
  for (let i = 0; i < lines.length; i++) {
    if (/\/split\s+start/i.test(lines[i])) {
      n++;
      if (n === idx) {
        const inline = lines[i].replace(/^\s*\[\d+:\d+\]\s*/, '').replace(/\/split\s+start/i, '').trim();
        if (inline) return { lineIdx: i, text: inline, inline: true };
        for (let j = i + 1; j < lines.length; j++) {
          const ln = lines[j].trim();
          if (!ln) continue;
          if (/^\[\d+:\d+\]/.test(ln) || /\/split/i.test(ln)) return null;
          return { lineIdx: j, text: lines[j].trim(), inline: false };
        }
        return null;
      }
    }
  }
  return null;
}
function setSplitCaption(idx, text) {
  const info = splitCaptionLine(idx);
  if (!info) return;
  const lines = (p().scriptText || '').split(/\r?\n/);
  const clean = text.replace(/\s*[\u2013\u2014]\s*/g, ', ').replace(/[\r\n]+/g, ' ').trim();
  if (info.inline) {
    const m = lines[info.lineIdx].match(/^\s*(\[\d+:\d+\]\s*)?(\/split\s+start)/i);
    lines[info.lineIdx] = (m ? (m[1] || '') + m[2] : '/split start') + ' ' + clean;
  } else {
    lines[info.lineIdx] = clean;
  }
  patch({ scriptText: lines.join('\n') });
  const sb = $('scriptText'); if (sb) sb.value = lines.join('\n');
  rebuildSegments(); renderTimeline(); paint();
}

// timestamp markers in the script, used by timeline edge-drag to retime splits
function getMarkers() {
  const lines = (p().scriptText || '').split(/\r?\n/);
  const out = [];
  lines.forEach((ln, i) => { const m = ln.match(/^\s*\[(\d+):(\d+)\]/); if (m) out.push({ lineIdx: i, t: (+m[1]) * 60 + (+m[2]) }); });
  return out;
}
function setMarkerTime(lineIdx, t) {
  const lines = (p().scriptText || '').split(/\r?\n/);
  if (lineIdx < 0 || lineIdx >= lines.length) return;
  const mm = Math.floor(t / 60), ss = Math.round(t % 60);
  const ts = `[${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}]`;
  lines[lineIdx] = lines[lineIdx].replace(/^\s*\[\d+:\d+\]/, ts);
  patch({ scriptText: lines.join('\n') });
  const sb = $('scriptText'); if (sb) sb.value = lines.join('\n');
}

function renderTimeline() {
  const inner = $('tlInner');
  const T = total() || 1;
  const W = Math.max(T * state.pxPerSec, $('tlScroll').clientWidth - 0);
  const LBL = 78;
  const x = (t) => LBL + t * state.pxPerSec;

  // ruler ticks
  const step = T > 60 ? 10 : T > 20 ? 5 : T > 8 ? 2 : 1;
  let ticks = '';
  for (let s = 0; s <= T; s += step) ticks += `<div class="tl-tick" style="left:${x(s)}px">${fmtTime(s)}</div>`;

  // video lane blocks
  const vBlocks = state.segments.map(seg => {
    const left = seg.start * state.pxPerSec, w = (seg.end - seg.start) * state.pxPerSec;
    const sel = (seg.stockIndex != null && seg.stockIndex === state.selectedSplit) ? 'selected' : '';
    const isSplit = seg.stockIndex != null;
    const click = isSplit ? `onclick="selectSplit(${seg.stockIndex})"` : `onclick="clearSelection()"`;
    const label = seg.layout === 'full-darwin' ? 'Darwin' : `${seg.layout.replace('-', ' ')} \u00b7 clip ${seg.stockIndex + 1}`;
    const edges = isSplit ? `<div class="tl-edge l" data-stock="${seg.stockIndex}" data-edge="l"></div><div class="tl-edge r" data-stock="${seg.stockIndex}" data-edge="r"></div>` : '';
    return `<div class="tl-block ${seg.layout} ${sel}" style="left:${left}px;width:${Math.max(2,w)}px" ${click} title="${label}">${edges}${w > 60 ? label : ''}</div>`;
  }).join('');

  const narrBlock = state.darwinUrl || p().darwinS3Key ? `<div class="tl-block narr" style="left:0px;width:${T*state.pxPerSec}px">narration (Darwin)</div>` : '';
  const musicBlock = p().musicS3Key ? `<div class="tl-block music" style="left:0px;width:${T*state.pxPerSec}px">${escapeHtml(p().musicName||'music')}</div>` : '';

  inner.style.width = (W + 20) + 'px';
  inner.innerHTML = `
    <div class="tl-ruler" id="tlRuler">${ticks}</div>
    <div class="tl-row"><div class="tl-rowlabel">Video</div><div class="tl-lane">${vBlocks}</div></div>
    <div class="tl-row"><div class="tl-rowlabel">Narration</div><div class="tl-lane">${narrBlock}</div></div>
    <div class="tl-row"><div class="tl-rowlabel">Music</div><div class="tl-lane">${musicBlock || '<div class="insp-meta" style="padding-left:8px;align-self:center">none</div>'}</div></div>
    <div class="tl-playhead" id="tlPlayhead" style="left:${x(0)}px"></div>
    <div class="tl-playhead-grip" id="tlGrip" style="left:${x(0)}px"></div>`;

  $('tlHint').textContent = 'click a split to select it, drag its left/right edge to resize; click a clip in the preview to scale or position it';

  // seek by clicking ruler
  const ruler = $('tlRuler');
  ruler.onclick = (e) => { const r = ruler.getBoundingClientRect(); const t = ($('tlScroll').scrollLeft + e.clientX - r.left - LBL) / state.pxPerSec; seek(t); };
  // drag playhead grip
  const grip = $('tlGrip');
  grip.onmousedown = (e) => {
    e.preventDefault(); const lane = ruler.getBoundingClientRect();
    const onMove = (ev) => { const t = ($('tlScroll').scrollLeft + ev.clientX - lane.left - LBL) / state.pxPerSec; seek(t); };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
  };
  // drag a split edge to resize it (edits the underlying [MM:SS] timing)
  inner.querySelectorAll('.tl-edge').forEach(h => {
    h.onmousedown = (e) => {
      e.preventDefault(); e.stopPropagation();
      const stockIdx = +h.dataset.stock, which = h.dataset.edge;
      const seg = state.segments.find(s => s.stockIndex === stockIdx);
      if (!seg) return;
      const targetTime = which === 'l' ? seg.start : seg.end;
      const markers = getMarkers();
      let mi = -1, best = 0.08;
      markers.forEach((m, k) => { const d = Math.abs(m.t - targetTime); if (d < best) { best = d; mi = k; } });
      if (mi < 0) return; // edge sits at reel end with no marker, not resizable
      const lo = mi > 0 ? markers[mi - 1].t + 0.4 : 0;
      const hi = mi < markers.length - 1 ? markers[mi + 1].t - 0.4 : (T - 0.4);
      const rulerRect = $('tlRuler').getBoundingClientRect();
      const onMove = (ev) => {
        let nt = ($('tlScroll').scrollLeft + ev.clientX - rulerRect.left - LBL) / state.pxPerSec;
        nt = Math.max(lo, Math.min(hi, nt));
        setMarkerTime(markers[mi].lineIdx, nt);
        rebuildSegments(); renderTimeline(); paint();
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    };
  });
  movePlayhead(darwinVid.src ? darwinVid.currentTime : 0);
}

  const ph = $('tlPlayhead'), g = $('tlGrip');

// Edits: script, stock, darwin, music  (+ autosave)
// =============================================================================
// ── Undo / redo ──────────────────────────────────────────────────────────────
// Every state change goes through patch(). We snapshot the project before a
// burst of changes and finalize after 600ms idle, so a drag is one undo step.
let undoStack = [], redoStack = [], pendingUndo = null, undoTimer = null, undoReady = false;
const MAX_UNDO = 60;
const snapProject = () => JSON.stringify(state.project);
function finalizePending() {
  clearTimeout(undoTimer);
  if (pendingUndo !== null && pendingUndo !== snapProject()) {
    undoStack.push(pendingUndo);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
    updateUndoButtons();
  }
  pendingUndo = null;
}
function patch(fields) {
  if (undoReady) {
    if (pendingUndo === null) pendingUndo = snapProject();
    clearTimeout(undoTimer);
    undoTimer = setTimeout(finalizePending, 600);
  }
  state.project = { ...state.project, ...fields };
  scheduleSave(fields);
}
async function applyProjectToUI() {

async function doUndo() {
  finalizePending();
  if (!undoStack.length) { toast('Nothing to undo'); return; }
  redoStack.push(snapProject());
  state.project = JSON.parse(undoStack.pop());
  await applyProjectToUI();
  DarwinAPI.update(PROJECT_ID, state.project).catch(() => {});
  updateUndoButtons();
}
async function doRedo() {
  if (!redoStack.length) { toast('Nothing to redo'); return; }
  undoStack.push(snapProject());
  state.project = JSON.parse(redoStack.pop());
  await applyProjectToUI();
  DarwinAPI.update(PROJECT_ID, state.project).catch(() => {});
  updateUndoButtons();
}
function updateUndoButtons() {

  if (r) r.disabled = redoStack.length === 0;
}

  clearTimeout(state.saveTimer);

    maybeBackfillDuration(true);
    toast('Darwin video swapped', 'success');
  } catch (e) { toast('Swap failed: ' + e.message, 'error'); }
};

// music set / remove
$('swapMusic').onclick = () => $('fMusic').click();
$('fMusic').onchange = async () => {
  const f = $('fMusic').files[0]; $('fMusic').value = '';
  if (!f) return;
  toast('Uploading music\u2026');
  try {
    const key = await DarwinAPI.uploadFile(PROJECT_ID, 'music', f);
    patch({ musicS3Key: key, musicName: f.name });
    state.musicUrl = await safeAssetUrl(key);
    musicAud.src = state.musicUrl || '';
    renderAssets(); renderTimeline(); renderInspector();
    toast('Music set', 'success');
  } catch (e) { toast('Music upload failed: ' + e.message, 'error'); }
};
$('rmMusic').onclick = () => {
  patch({ musicS3Key: null, musicName: null });
  state.musicUrl = null; musicAud.src = ''; renderAssets(); renderTimeline(); renderInspector();
};

// duration backfill
function maybeBackfillDuration(force) {
  if (!force && p().totalDuration) return;
  if (!darwinVid.src) return;
  const tryRead = () => {
    const d = darwinVid.duration;
    if (isFinite(d) && d > 0) {
      const wasTrimmed = isTrimmed();
      patch({ totalDuration: d });
      rebuildSegments();
      if (!wasTrimmed) { state.trimIn = 0; state.trimOut = d; } // untrimmed window follows the take
      renderAssets(); renderTimeline(); paint();
    }
  };
  darwinVid.addEventListener('loadedmetadata', tryRead, { once: true });
  if (darwinVid.readyState >= 1) tryRead();
}

// =============================================================================
// Render + poll
// =============================================================================
function setStatus(st) {
  const pill = $('statusPill');
  pill.className = 'status-pill ' + st;
  pill.textContent = ({ editing: 'Editing', rendering: 'Rendering\u2026', complete: 'Ready', failed: 'Failed' }[st] || st);
  const done = st === 'complete' && p().render && p().render.mp4Url;
  $('dlBtn').classList.toggle('hidden', !done);
  if (done) $('dlBtn').href = p().render.mp4Url;
  $('renderBtn').disabled = (st === 'rendering');
  $('renderBtn').textContent = st === 'rendering' ? 'Rendering\u2026' : (st === 'complete' ? 'Re-render' : 'Render');
}

$('renderBtn').onclick = async () => {
  // flush all current state, then dispatch
  $('renderBtn').disabled = true; $('renderBtn').textContent = 'Saving\u2026';
  try {
    clearTimeout(state.saveTimer);
    await DarwinAPI.update(PROJECT_ID, {
      scriptText: $('scriptText').value,
      layoutOverrides: p().layoutOverrides || {},
      defaultLayout: p().defaultLayout || 'stock-top',
      darwinClips: p().darwinClips || [],
      clipTransforms: p().clipTransforms || {},
      totalDuration: p().totalDuration || 0,
      stockS3Keys: p().stockS3Keys || [], stockNames: p().stockNames || [],
      musicVolume: (typeof p().musicVolume === 'number') ? p().musicVolume : 0.15,
      captionStyle: p().captionStyle || {},
    });
    await DarwinAPI.render(PROJECT_ID);
    state.project.status = 'rendering';
    setStatus('rendering');
    toast('Render dispatched', 'success');
    startPolling();
  } catch (e) { toast('Render failed: ' + e.message, 'error'); setStatus(p().status || 'editing'); }
};

function startPolling() {
  clearInterval(state.pollTimer);
  state.pollTimer = setInterval(async () => {
    try {
      const r = await DarwinAPI.renderStatus(PROJECT_ID);
      if (r.status === 'complete') {
        clearInterval(state.pollTimer);
        state.project = await DarwinAPI.get(PROJECT_ID);
        setStatus('complete'); toast('Render complete', 'success');
      } else if (r.status === 'failed') {
        clearInterval(state.pollTimer);
        state.project.status = 'failed'; setStatus('failed');
        toast('Render failed: ' + (r.error || 'see logs'), 'error');
      }
    } catch (e) { /* transient, keep polling */ }
  }, 5000);
}

boot();
</script>
</body>
</html>
