<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Darwin Reel Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Reels are vertical: override the shared 16/9 thumb to 9/16. */
  .card-thumb.reel {
    aspect-ratio: 9 / 16;
    background:
      #EDF6FF
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 100'><rect fill='%230183FF' opacity='0.07' width='56' height='100'/><circle cx='28' cy='34' r='10' fill='%230183FF' opacity='0.22'/><path d='M10 74 Q10 54, 28 54 Q46 54, 46 74 Z' fill='%230183FF' opacity='0.22'/></svg>")
      center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-thumb.reel video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .play-badge {
    position: absolute; inset: 0; margin: auto;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(1,131,255,0.9); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; pointer-events: none;
  }
  /* tighten the grid for narrow cards */
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card-icon-btn {
    width: 30px; flex: 0 0 30px !important; padding: 5px 0 !important;
  }
  .loading-note { text-align:center; color:#5B7795; font-size:13px; padding:60px 0; }
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar-brand" href="home.html">
    <span class="topbar-logo">d</span>
    <span class="topbar-title">Darwinbox MarkOps Tools</span>
    <span class="topbar-subtitle">Darwin Reel Editor</span>
  </a>
  <a href="home.html" class="btn">&larr; Back to hub</a>
</div>

<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Darwin Reels</h1>
      <p class="page-subtitle">Vertical 1080 &times; 1920 reels. Script-driven splits over a continuous Darwin take.</p>
    </div>
    <a href="darwin-upload.html" class="btn btn-primary">+ New reel</a>
  </div>

  <div id="content">
    <div class="loading-note">Loading reels&hellip;</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/darwin-api.js"></script>
<script>
const content = document.getElementById('content');

function toast(msg, kind = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + kind;
  setTimeout(() => { t.className = 'toast ' + kind; }, 2600);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
    ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function fmtDur(sec) {
  sec = Math.round(sec || 0);
  if (!sec) return '';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? `${m}:${String(s).padStart(2, '0')}` : `${s}s`;
}

function statusLabel(st) {
  return ({ editing: 'Editing', rendering: 'Rendering', complete: 'Ready',
            failed: 'Failed', pending_render: 'Queued' }[st] || st || 'Editing');
}

function metaLine(p) {
  const bits = [];
  if (p.totalDuration) bits.push(fmtDur(p.totalDuration));
  const segN = (p.segments || []).length;
  if (segN) bits.push(`${segN} segment${segN === 1 ? '' : 's'}`);
  const splitN = (p.segments || []).filter(s => s.layout && s.layout !== 'full-darwin').length;
  if (splitN) bits.push(`${splitN} split${splitN === 1 ? '' : 's'}`);
  bits.push(fmtDate(p.updatedAt || p.createdAt));
  return bits.join(' \u00b7 ');
}

function cardHTML(p) {
  const st = p.status || 'editing';
  const isDone = st === 'complete' && p.render && p.render.mp4Url;
  const thumb = isDone
    ? `<video src="${escapeHtml(p.render.mp4Url)}" muted preload="metadata"></video><div class="play-badge">&#9658;</div>`
    : '';
  const dl = isDone
    ? `<a class="btn" href="${escapeHtml(p.render.mp4Url)}" download onclick="event.stopPropagation()">Download</a>`
    : '';
  return `
    <div class="card" data-id="${escapeHtml(p.projectId)}" onclick="openEditor('${escapeHtml(p.projectId)}')">
      <div class="card-thumb reel">
        ${thumb}
        <span class="card-status ${st}">${statusLabel(st)}</span>
      </div>
      <div class="card-body">
        <div class="card-title" title="${escapeHtml(p.title)}">${escapeHtml(p.title || 'Untitled reel')}</div>
        <div class="card-meta">${escapeHtml(metaLine(p))}</div>
        <div class="card-actions">
          <a class="btn" href="darwin-editor.html?id=${encodeURIComponent(p.projectId)}" onclick="event.stopPropagation()">Edit</a>
          ${dl}
          <button class="btn card-icon-btn" title="Duplicate" onclick="event.stopPropagation();dup('${escapeHtml(p.projectId)}')">&#9092;</button>
          <button class="btn btn-danger card-icon-btn" title="Delete" onclick="event.stopPropagation();del('${escapeHtml(p.projectId)}','${escapeHtml(p.title)}')">&times;</button>
        </div>
      </div>
    </div>`;
}

function emptyHTML() {
  return `
    <div class="empty-state">
      <div class="empty-state-title">No reels yet</div>
      <div class="empty-state-text">Create your first vertical reel from a Darwin take, stock clips, and a script.</div>
      <a href="darwin-upload.html" class="btn btn-primary">+ New reel</a>
    </div>`;
}

async function load() {
  try {
    const projects = await DarwinAPI.list();
    if (!projects.length) { content.innerHTML = emptyHTML(); return; }
    content.innerHTML = `<div class="cards-grid">${projects.map(cardHTML).join('')}</div>`;
  } catch (e) {
    content.innerHTML = `<div class="empty-state"><div class="empty-state-title">Could not load reels</div><div class="empty-state-text">${escapeHtml(e.message)}</div></div>`;
  }
}

function openEditor(id) { window.location.href = `darwin-editor.html?id=${encodeURIComponent(id)}`; }

async function dup(id) {
  try { toast('Duplicating\u2026'); await DarwinAPI.duplicate(id); await load(); toast('Duplicated', 'success'); }
  catch (e) { toast('Duplicate failed: ' + e.message, 'error'); }
}

async function del(id, title) {
  if (!confirm(`Delete "${title || 'this reel'}"? This cannot be undone.`)) return;
  try { await DarwinAPI.remove(id); await load(); toast('Deleted', 'success'); }
  catch (e) { toast('Delete failed: ' + e.message, 'error'); }
}

load();
</script>
</body>
</html>
