name: Render Testimonial Video

on:
  repository_dispatch:
    types: [render-testimonial]

  workflow_dispatch:
    inputs:
      payload_json_b64:
        description: 'Base64-encoded payload JSON'
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion deps
        run: npm install --no-audit --no-fund
        working-directory: remotion

      - name: Install render-script deps
        run: npm install --no-audit --no-fund
        working-directory: scripts

      - name: Install Chromium for Remotion
        run: npx remotion browser ensure
        working-directory: remotion

      - name: Decode payload
        id: payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          PAYLOAD_JSON_B64: ${{ inputs.payload_json_b64 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$CLIENT_PAYLOAD" > raw-dispatch.json
            IS_LARGE=$(jq -r '.large // false' raw-dispatch.json)
            if [ "$IS_LARGE" = "true" ]; then
              PAYLOAD_URL=$(jq -r '.payloadUrl' raw-dispatch.json)
              HTTP_CODE=$(curl -sS -o render-payload.json -w "%{http_code}" "$PAYLOAD_URL")
              if [ "$HTTP_CODE" != "200" ]; then
                echo "ERROR: payload fetch returned HTTP $HTTP_CODE"
                head -c 1000 render-payload.json
                exit 1
              fi
            else
              cp raw-dispatch.json render-payload.json
            fi
          else
            printf '%s' "$PAYLOAD_JSON_B64" | base64 -d > render-payload.json
          fi

          JOB_ID=$(jq -r '.jobId // .projectId // "unknown"' render-payload.json)
          PROJECT_ID=$(jq -r '.projectId // .jobId // "unknown"' render-payload.json)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Decoded payload for job=$JOB_ID project=$PROJECT_ID"
          jq '{
            jobId,
            projectId,
            calloutCount: (.callouts | length),
            totalDuration,
            hasVideo: (.global.sourceVideoUrl != null)
          }' render-payload.json

      # Build the inputProps file Remotion will consume.
      # Strips legacy fields the new composition doesn't use.
      - name: Prepare inputProps
        run: |
          set -e
          jq '{
            intro: (.intro // {}),
            namecard: (.namecard // {}),
            global: (.global // {}),
            callouts: (.callouts // []),
            totalDuration: (.totalDuration // 240)
          }' render-payload.json > input-props.json
          echo "=== input-props.json ==="
          jq '{
            introHeadline: .intro.headline,
            namecard: .namecard.name,
            totalDuration,
            callouts: (.callouts | length),
            videoUrl: .global.sourceVideoUrl
          }' input-props.json

      - name: Render the video locally with Remotion CLI
        id: render
        working-directory: remotion
        run: |
          set -e
          OUTPUT_FILE="/tmp/output.mp4"
          INPUT_PROPS="$GITHUB_WORKSPACE/input-props.json"

          echo "=== Starting Remotion render ==="
          echo "Output: $OUTPUT_FILE"
          echo "Input props: $INPUT_PROPS"
          echo "System resources:"
          free -h
          df -h /tmp
          nproc
          echo ""

          # Render the full composition.
          # --concurrency=4 uses 4 CPU cores in parallel (runners have 4)
          # --crf=22 = balanced quality/size for h264
          npx remotion render src/index.ts TestimonialReel "$OUTPUT_FILE" \
            --props="$INPUT_PROPS" \
            --concurrency=4 \
            --codec=h264 \
            --crf=22 \
            --pixel-format=yuv420p \
            --image-format=jpeg \
            --log=info \
            --offthreadvideo-cache-size-in-bytes=524288000

          echo ""
          echo "=== Render complete ==="
          ls -lh "$OUTPUT_FILE"

      - name: Upload final mp4 to S3
        id: upload
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
          PROJECT_ID: ${{ steps.payload.outputs.project_id }}
          BUCKET: darwinbox-gartner-testimonial-editor
        run: |
          set -e
          OUTPUT_KEY="testimonials/${PROJECT_ID}/output.mp4"
          aws s3 cp /tmp/output.mp4 "s3://${BUCKET}/${OUTPUT_KEY}" \
            --content-type "video/mp4" \
            --cache-control "max-age=3600"
          MP4_URL="https://${BUCKET}.s3.ap-south-1.amazonaws.com/${OUTPUT_KEY}"
          echo "Uploaded: $MP4_URL"
          echo "mp4_url=$MP4_URL" >> "$GITHUB_OUTPUT"
          echo "output_key=$OUTPUT_KEY" >> "$GITHUB_OUTPUT"

      - name: Write job status to S3
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
          JOB_ID: ${{ steps.payload.outputs.job_id }}
          JOB_STATUS: ${{ job.status }}
          MP4_URL: ${{ steps.upload.outputs.mp4_url }}
          OUTPUT_KEY: ${{ steps.upload.outputs.output_key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUCKET: darwinbox-gartner-testimonial-editor
        run: |
          set -e
          KEY="job-status/${JOB_ID}.json"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ "$JOB_STATUS" = "success" ] && [ -n "$MP4_URL" ]; then
            BODY=$(jq -n \
              --arg jobId "$JOB_ID" \
              --arg mp4Url "$MP4_URL" \
              --arg outputKey "$OUTPUT_KEY" \
              --arg completedAt "$NOW" \
              --arg runUrl "$RUN_URL" \
              '{status: "success", jobId: $jobId, mp4Url: $mp4Url, outputKey: $outputKey, completedAt: $completedAt, runUrl: $runUrl}')
          else
            BODY=$(jq -n \
              --arg jobId "$JOB_ID" \
              --arg completedAt "$NOW" \
              --arg runUrl "$RUN_URL" \
              '{status: "failed", jobId: $jobId, completedAt: $completedAt, error: "Render failed — see GitHub Actions logs", logsUrl: $runUrl, runUrl: $runUrl}')
          fi

          echo "$BODY" | tee /tmp/status.json
          aws s3 cp /tmp/status.json "s3://${BUCKET}/${KEY}" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store"

          echo "Status: https://${BUCKET}.s3.ap-south-1.amazonaws.com/${KEY}"
